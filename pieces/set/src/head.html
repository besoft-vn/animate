<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sét hình thành như thế nào?</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  VẠN VẬT VẬN HÀNH — "Sét hình thành như thế nào?" — 9:16, sketchbook, voiced (vi), 24fps, 120 BPM.
//  Format F5 (fixed-hero journey): the sketchbook hero (terracotta doodle, "Tia") watches a storm from a hill, floats up
//  into the thunderstorm cloud, rides the ice: it hops onto a falling soft-hail pellet and picks up a "−" badge (it IS
//  a negative charge from "charge" on), sinks to the cloud base, then LEADS the faint stepped leader down, step by step;
//  an upward streamer rises from the tree top and meets it -> pause -> SLAM: the bright return stroke races from the
//  GROUND UP to the cloud; then the 5×-the-sun heat, the air bursting into thunder, and the same hill at the end.
//  KHUNG HÌNH GỌN: one subject per frame, bare paper; ≤ 10 charges / ice bits per frame, each big (r ≥ 18), no dots.
//  Colour (one colour = one meaning): TERRACOTTA = the hero only · BLUE (COL.pos) = POSITIVE charge "+" and the small ice
//  crystals that carry it · PLUM (COL.neg) = NEGATIVE charge "−" (on the soft-hail pellets, the cloud base, the hero's
//  badge, the leader's tip) · YELLOW highlighter (COL.flash) = LIGHT only (the bright return stroke, flashes) ·
//  RED-ORANGE (COL.hot) = heat only (the thermometer, the hot channel's rim in "heat") · graphite = the faint leader,
//  the streamer before it lights, cloud washes, sound rings · ink = settled outlines, ground, tree.
//  The voice is the clock: era i starts on the 8th after line i-1 ends (+0.3s). The payoff era "strike" starts on the
//  SLAM: a hard cut inside the 1.6s pause after "meet". Shared file: owned by the director; agents never edit it.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const snap8 = (t) => Math.round(t / E8) * E8;
const SAFE = { top: 240, bottom: 420, right: 140 };
// Vietnamese-capable handwriting: Pangolin (installed by channel/setup.sh), then system fallbacks with Vietnamese glyphs
const HAND = '"Pangolin", "Segoe Print", "Comic Sans MS", "DejaVu Sans", sans-serif';
const CX = 500;

// ---- the voice: VOICE is injected by tools/build.mjs from voice.json
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const _vn = (w) => w.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
// VW(id, word, n): when the n-th (1-based) occurrence of `word` in line `id` starts (falls back to the line start)
function VW(id, word, n = 1) { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t0; return L.t0; }
const VE = (id, word, n = 1) => { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t1; return L.t1; };

const IDS = ['hook', 'cloud', 'collide', 'charge', 'leader', 'meet', 'strike', 'heat', 'thunder', 'end'];
const SLAM_ID = 'strike';
const SLAM = snap8(VL('meet').t1 + 0.85);
const ERA_T = IDS.map((id, i) => (i === 0 ? 0 : id === SLAM_ID ? SLAM : snap8(VL(IDS[i - 1]).t1 + 0.3)));
const DURATION = Math.ceil(VOICE.duration / E8) * E8;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const ET = (id) => ERA_T[IDS.indexOf(id)];                       // era start
const EE = (id) => (IDS.indexOf(id) + 1 < IDS.length ? ERA_T[IDS.indexOf(id) + 1] : DURATION);   // era end

// ---- colours (beyond the kit's SK palette)
const COL = {
  pos: '#3f7fc4', posL: '#a9cdee',            // POSITIVE charge "+" / the small ice crystals
  neg: '#7b4a8e', negL: '#d3bddc',            // NEGATIVE charge "−" / soft-hail pellets' charge
  flash: '#f7d64a', flashD: '#d9b21e',        // LIGHT only (= SK.hilite)
  hot: '#e2683c', hotL: '#f6c3a6',            // HEAT only
  cloud: '#8d8a86', cloudL: '#c9c5bf', cloudD: '#5d5955',   // the storm cloud (graphite washes)
  sky: '#dfe3e6', grass: '#7aa36b', grassL: '#c5dbb8', hail: '#e9e6df',
};
// ---- shared geometry (props.js draws it) — THE HILL ("hook", "cloud" (start), "leader", "meet", "strike", "end"):
// the ground line at GROUND_Y; the tree (TREE) whose top is the streamer's start; the storm cloud's flat base at
// CLOUD.base; the channel path BOLT (cloud base -> meeting point -> tree top), fixed points so every scene agrees.
const GROUND_Y = 1180;
const TREE = { x: 700, y: GROUND_Y, h: 220 };                  // trunk foot (x, y); top of the crown = (700, 960)
const TREE_TOP = [700, 960];
const CLOUD = { x: 520, top: 410, base: 690, w: 900 };          // the storm cloud on the hill: flat base at y 690
const MEET = [628, 880];                                         // where the leader (from above) meets the streamer
// the channel: cloud base -> MEET (leader, 6 steps), MEET -> TREE_TOP (streamer). Shared so the strike = the leader.
const BOLT_LEADER = [[430, 690], [466, 718], [450, 748], [508, 776], [530, 808], [590, 830], [604, 856], MEET];
const BOLT_STREAM = [MEET, [664, 902], [684, 932], TREE_TOP];
// ---- the bridges' contract: where the hero (doodleHero radius HR) MUST be at each boundary.
// Scenes keep it exactly there during [tc - 0.5, tc + 0.5]. Cameras: identity within 0.5s of a boundary.
const HR = 54;
const BR = {
  hookCloud:      { a: [300, 1100], b: [300, 1100] },   // on the hill, left of the tree, looking up at the cloud
  cloudCollide:   { a: [540, 860],  b: [540, 860] },    // inside the cloud (camera pushed in / interior), centre
  collideCharge:  { a: [600, 900],  b: [600, 900] },    // riding a soft-hail pellet (hero on top of it), −badge on
  chargeLeader:   { a: [430, 1060], b: [430, 690] },    // at the cloud's (interior) base -> at the cloud base on the hill
  leaderMeet:     { a: MEET,        b: MEET },          // at the leader's tip, just above the tree, waiting
  // meet -> strike: SLAM (hard cut, no bridge); strike is complete on its first frame (hero aside at STRIKE_HERO)
  strikeHeat:     { a: [860, 760],  b: [860, 760] },    // beside the blazing channel -> beside the close-up channel
  heatThunder:    { a: [860, 760],  b: [860, 760] },
  thunderEnd:     { a: [300, 1100], b: [300, 1100] },   // blown back to the hill, left of the tree
};
const STRIKE_HERO = [860, 760];
const ERA_LIST = IDS.map((id, i) => [ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, () => SCENES[id]()]);
const SCENES = {};                                               // each scene file registers SCENES.<id> = function () {...}
const TITLES = {
  hook: 'sét chói nhất đi từ đất lên', cloud: 'mây dông cao hơn 10 km', collide: 'băng nhỏ lên, mưa đá mềm xuống',
  charge: 'dương lên đỉnh, âm xuống đáy', leader: 'tia tiên đạo dò từng bước', meet: 'tia ngược từ ngọn cây',
  strike: 'chớp: từ đất vọt lên mây', heat: 'nóng gấp 5 lần Mặt Trời', thunder: 'không khí nổ bung: sấm', end: 'chớp đi từ dưới đất lên',
};
const SHOTS = IDS.map((id, i) => [id, i, ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, TITLES[id]]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'fixed-hero journey (morph-joined, one slam)',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [SLAM],
  morphs: ERA_T.slice(1).filter((t) => t !== SLAM),
  cues: { slam: SLAM, bloom: SLAM },
  acts: [
    { name: '1 Mây dông',     role: 'build',   t0: 0,           t1: ET('leader') },
    { name: '2 Tiên đạo',     role: 'journey', t0: ET('leader'), t1: ET('meet') },
    { name: '3 Gặp nhau',     role: 'peak',    t0: ET('meet'),  t1: snap8(VL('meet').t1) },
    { name: '4 Lặng',         role: 'silence', t0: snap8(VL('meet').t1), t1: SLAM - 0.125 },
    { name: '5 Chớp!',        role: 'gift',    t0: SLAM,        t1: SLAM + 2.25 },
    { name: '6 Nóng, sấm',    role: 'goodbye', t0: SLAM + 2.25, t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: +(ERA_T[i] + ((i + 1 < IDS.length ? ERA_T[i + 1] : DURATION) - ERA_T[i]) * 0.6).toFixed(2), title: TITLES[id], sound: '', next: i + 1 < IDS.length ? TITLES[IDS[i + 1]] : 'hết' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
