<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phanh xe máy dừng xe như thế nào?</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  VẠN VẬT VẬN HÀNH — "Phanh xe máy dừng xe như thế nào?" — 9:16, crosshatch, voiced (vi), 24fps, 120 BPM.
//  Format F2 (chronology, object-morph joined): the street (a scooter brakes, its front disc warms) -> the squeeze at the
//  lever -> the brake fluid carries the push down the hose -> the caliper's bigger piston multiplies it -> the pads clamp
//  the spinning disc -> friction turns the bike's motion into heat -> the tyre's grip on the road stops the bike ->
//  pause -> SLAM: stopping from 50 km/h = a fall from almost 10 m -> the front wheel does ~7/10 -> the red light, disc warm.
//  KHUNG HÌNH GỌN: one subject per frame, flat paper; ≤ 8 fluid balls / heat wisps per frame, each big; no dot fields.
//  Colour = one meaning: BLUE COL.oil = brake fluid / pressure ONLY · RED C.red (forceArrow) = FORCES only ·
//  TERRACOTTA C.terra (tempCol, heatWisps) = HEAT only · steel greys = metal · ink = everything else.
//  The bike always faces RIGHT and moves RIGHT (the road / background slide LEFT); its wheels turn CLOCKWISE.
//  The voice is the clock: era i starts on the 8th after line i-1 ends (+0.3s). The payoff era starts on the SLAM: a hard
//  cut inside the 1.6s pause after "tyre". Shared file: owned by the director; agents never edit it.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const snap8 = (t) => Math.round(t / E8) * E8;
const SAFE = { top: 240, bottom: 420, right: 140 };
// Vietnamese-capable handwriting: Pangolin (installed by channel/setup.sh), then system fallbacks with Vietnamese glyphs
const HAND = '"Pangolin", "Segoe Print", "Comic Sans MS", "DejaVu Sans", sans-serif';
const CX = 500;

// ---- the voice: VOICE is injected by tools/build.mjs from voice.json
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const _vn = (w) => w.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
// VW(id, word, n): when the n-th (1-based) occurrence of `word` in line `id` starts (falls back to the line start)
function VW(id, word, n = 1) { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t0; return L.t0; }
const VE = (id, word, n = 1) => { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t1; return L.t1; };

const IDS = ['hook', 'lever', 'fluid', 'caliper', 'clamp', 'heat', 'tyre', 'payoff', 'front', 'end'];
const SLAM_ID = 'payoff';
const SLAM = snap8(VL('tyre').t1 + 0.85);
const ERA_T = IDS.map((id, i) => (i === 0 ? 0 : id === SLAM_ID ? SLAM : snap8(VL(IDS[i - 1]).t1 + 0.3)));
const DURATION = Math.ceil(VOICE.duration / E8) * E8;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const ET = (id) => ERA_T[IDS.indexOf(id)];                       // era start
const EE = (id) => (IDS.indexOf(id) + 1 < IDS.length ? ERA_T[IDS.indexOf(id) + 1] : DURATION);   // era end

// ---- colours (beyond the kit's C palette)
const COL = {
  oil: '#3f7fc4', oilL: '#a9cdee',            // BRAKE FLUID / pressure ONLY
  steel: '#c9c6bf', steelD: '#8f8b84', steelL: '#e6e3dc',   // metal (disc, caliper, pistons, cylinders)
  pad: '#6b5442',                              // brake pads (friction material)
  tyre: '#3d3733', road: '#cfc8ba', roadD: '#a39b8c',
  body: '#e9c46a', bodyD: '#c99b3a',           // the scooter's paint (mustard) — NOT a meaning colour, only the bike
  helmet: '#5f9c5c',
};
// ---- THE STREET (hook, front, end; props.scooter() draws it): the scooter faces RIGHT, ground line GROUND_Y.
// Front wheel FW, rear wheel RW (x, y, r); the front disc on FW (radius DISC_R); the handlebar grip GRIP.
const GROUND_Y = 1152;
const FW = [770, 1060, 92], RW = [290, 1060, 92], DISC_R = 50, GRIP = [722, 646];
// ---- the bridges' contract: the object (a circle [x, y, r]) that MUST be exactly there at each boundary, in that
// era's world coords. Scenes keep it there during [tc - 0.5, tc + 0.5]. Cameras: identity within 0.5s of a boundary.
const BR = {
  hookLever:    { a: [GRIP[0], GRIP[1], 80], b: [540, 820, 250] },   // the hand on the grip (street) -> the grip + lever close-up
  leverFluid:   { a: [540, 1020, 170],       b: [300, 520, 100] },   // the master cylinder (close-up) -> the master cylinder (system diagram, top-left)
  fluidCaliper: { a: [720, 1080, 110],       b: [540, 860, 280] },   // the caliper on the wheel (diagram) -> the caliper cross-section
  caliperClamp: { a: [540, 860, 280],        b: [540, 860, 300] },   // the caliper cross-section -> the disc (face-on, centre)
  clampHeat:    { a: [540, 860, 300],        b: [540, 860, 300] },   // the disc
  heatTyre:     { a: [540, 860, 300],        b: [540, 800, 150] },   // the disc -> the disc inside the big front wheel (tyre close-up)
  // tyre -> payoff: SLAM (hard cut, no bridge); payoff is complete on its first frame
  payoffFront:  { a: [820, 1100, 70],        b: [FW[0], FW[1], FW[2]] },   // the payoff scooter's front wheel -> the street scooter's front wheel
  frontEnd:     { a: [FW[0], FW[1], FW[2]],  b: [FW[0], FW[1], FW[2]] },   // the front wheel (same street framing)
};
const ERA_LIST = IDS.map((id, i) => [ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, () => SCENES[id]()]);
const SCENES = {};                                               // each scene file registers SCENES.<id> = function () {...}
const TITLES = {
  hook: 'tốc độ hóa thành nhiệt', lever: 'bóp tay phanh', fluid: 'dầu không nén được', caliper: 'pít-tông to: lực nhân lên',
  clamp: 'má phanh kẹp đĩa', heat: 'ma sát: động năng → nhiệt', tyre: 'lốp bám đường kéo xe dừng',
  payoff: '50 km/h = rơi gần 10 m', front: 'bánh trước gánh ~7/10', end: 'tốc độ thành hơi ấm',
};
const SHOTS = IDS.map((id, i) => [id, i, ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, TITLES[id]]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'chronology (morph-joined, one slam)',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [SLAM],
  morphs: ERA_T.slice(1).filter((t) => t !== SLAM),
  cues: { slam: SLAM, bloom: SLAM },
  acts: [
    { name: '1 Bóp phanh',    role: 'build',   t0: 0,            t1: ET('caliper') },
    { name: '2 Kẹp đĩa',      role: 'journey', t0: ET('caliper'), t1: ET('tyre') },
    { name: '3 Lốp bám',      role: 'peak',    t0: ET('tyre'),   t1: snap8(VL('tyre').t1) },
    { name: '4 Lặng',         role: 'silence', t0: snap8(VL('tyre').t1), t1: SLAM - 0.125 },
    { name: '5 Mười mét!',    role: 'gift',    t0: SLAM,         t1: SLAM + 2.25 },
    { name: '6 Bánh trước',   role: 'goodbye', t0: SLAM + 2.25,  t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: +(ERA_T[i] + ((i + 1 < IDS.length ? ERA_T[i + 1] : DURATION) - ERA_T[i]) * 0.6).toFixed(2), title: TITLES[id], sound: '', next: i + 1 < IDS.length ? TITLES[IDS[i + 1]] : 'hết' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
