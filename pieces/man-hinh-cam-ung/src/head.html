<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màn hình cảm ứng biết ngón tay bạn ở đâu?</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  VẠN VẬT VẬN HÀNH — "Màn hình cảm ứng biết ngón tay bạn ở đâu?" — 9:16, isometric, voiced (vi), 24fps, 120 BPM.
//  Format F5 (fixed-hero journey): the hero is a FINGERTIP (skin capsule, nail, two dark eyes; heroFinger in props.js).
//  It taps a phone (hook), watches the glass lift off the electrode grid, the tiny capacitors, the chip's scan; then it
//  touches and pulls part of the field away; the readings under it dip; the chip sweeps the grid -> SLAM: the dip's
//  centre = a crosshair on the hero's tip. A woollen glove changes nothing. The end is the start, changed: the same
//  phone, the hero touching it, the grid and the dip now visible under the glass.
//  KHUNG HÌNH GỌN: one subject per frame, white ground, hairlines; grids ≤ 6×5, field lines ≤ 6 per frame.
//  Colour (one colour = one meaning): BLUE = the electric field / signal; SKIN = the finger / the body; DARK accent =
//  the found touch point (crosshair) + the hero's eyes; WOOL = the glove; grey hairlines = everything else.
//  The voice is the clock: era i starts on the 8th after line i-1 ends (+0.3s). The payoff era "locate" starts on the
//  SLAM: a hard cut inside the 1.6s pause after "sweep". Shared file: owned by the director; agents never edit it.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const snap8 = (t) => Math.round(t / E8) * E8;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

// ---- the voice: VOICE is injected by tools/build.mjs from voice.json
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const _vn = (w) => w.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
// VW(id, word, n): when the n-th (1-based) occurrence of `word` in line `id` starts (falls back to the line start)
function VW(id, word, n = 1) { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t0; return L.t0; }
const VE = (id, word, n = 1) => { const L = VL(id), k = _vn(word); let c = 0; for (const w of L.words) if (_vn(w.w) === k && ++c === n) return w.t1; return L.t1; };

const IDS = ['hook', 'grid', 'cap', 'scan', 'finger', 'drop', 'sweep', 'locate', 'glove', 'end'];
const SLAM_ID = 'locate';
const SLAM = snap8(VL('sweep').t1 + 0.85);
const ERA_T = IDS.map((id, i) => (i === 0 ? 0 : id === SLAM_ID ? SLAM : snap8(VL(IDS[i - 1]).t1 + 0.3)));
const DURATION = Math.ceil(VOICE.duration / E8) * E8;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const ET = (id) => ERA_T[IDS.indexOf(id)];                       // era start
const EE = (id) => (IDS.indexOf(id) + 1 < IDS.length ? ERA_T[IDS.indexOf(id) + 1] : DURATION);   // era end

// ---- the bridges' contract: where the hero (heroFinger radius HR; (x, y) = the centre of its body; its TIP is at
// y + 1.3 HR = y + 70) MUST be at each boundary. Scenes keep it exactly there during [tc - 0.5, tc + 0.5].
// Cameras: identity within 0.5s of a boundary.
// HOVER = [540, 520] (tip at y 590, watching); TOUCH = [540, 700] (tip ON the surface at (540, 770) — every scene that
// shows the touch puts the touched surface / the touch point at (540, 770)).
const HR = 54;
const HOVER = [540, 520], TOUCH = [540, 700], TOUCH_PT = [540, 770];
const BR = {
  hookGrid:    { a: HOVER, b: HOVER },   // above the phone (iso) -> above the lifted glass / the grid (iso)
  gridCap:     { a: HOVER, b: HOVER },   // -> above the cross-section
  capScan:     { a: HOVER, b: HOVER },   // -> above the flat top-view grid + chip
  scanFinger:  { a: HOVER, b: HOVER },   // -> above the cross-section (it then comes down and touches)
  fingerDrop:  { a: TOUCH, b: TOUCH },   // touching the glass (section) -> touching the grid (top view)
  dropSweep:   { a: TOUCH, b: TOUCH },
  // sweep -> locate: SLAM (hard cut, no bridge); locate is complete on its first frame, hero still at TOUCH
  locateGlove: { a: TOUCH, b: TOUCH },   // (top view) -> the cross-section, the hero now wears a woollen glove
  gloveEnd:    { a: TOUCH, b: TOUCH },   // (section, gloved) -> the phone (iso) again, bare finger touching it
};
const ERA_LIST = IDS.map((id, i) => [ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, () => SCENES[id]()]);
const SCENES = {};                                               // each scene file registers SCENES.<id> = function () {...}
const TITLES = {
  hook: 'không đo lực ấn', grid: 'lưới điện cực trong suốt', cap: 'mỗi giao điểm: một tụ điện', scan: 'chip gửi xung, cột nghe',
  finger: 'ngón tay kéo điện trường đi', drop: 'tín hiệu hụt dưới ngón tay', sweep: 'quét ~120 lần mỗi giây',
  locate: 'tâm vùng hụt = chỗ chạm', glove: 'găng len: không hụt gì', end: 'thấy chỗ điện trường bị lấy mất',
};
const SHOTS = IDS.map((id, i) => [id, i, ERA_T[i], i + 1 < IDS.length ? ERA_T[i + 1] : DURATION, TITLES[id]]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'fixed-hero journey (morph-joined, one slam)',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [SLAM],
  morphs: ERA_T.slice(1).filter((t) => t !== SLAM),
  cues: { slam: SLAM, bloom: SLAM },
  acts: [
    { name: '1 Lưới',         role: 'build',   t0: 0,           t1: ET('finger') },
    { name: '2 Ngón tay',     role: 'journey', t0: ET('finger'), t1: ET('sweep') },
    { name: '3 Quét',         role: 'peak',    t0: ET('sweep'), t1: snap8(VL('sweep').t1) },
    { name: '4 Lặng',         role: 'silence', t0: snap8(VL('sweep').t1), t1: SLAM - 0.125 },
    { name: '5 Chỗ chạm',     role: 'gift',    t0: SLAM,        t1: SLAM + 2.25 },
    { name: '6 Găng tay',     role: 'goodbye', t0: SLAM + 2.25, t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: +(ERA_T[i] + ((i + 1 < IDS.length ? ERA_T[i + 1] : DURATION) - ERA_T[i]) * 0.6).toFixed(2), title: TITLES[id], sound: '', next: i + 1 < IDS.length ? TITLES[IDS[i + 1]] : 'hết' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
